<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style3.css">
    <style>
        .success-message {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid #4ecdc4;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message i {
            font-size: 2rem;
            color: #4ecdc4;
            margin-bottom: 10px;
        }
        .success-message p {
            color: #fff;
            line-height: 1.6;
        }
        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            color: #ff6b6b;
            display: none;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Quên mật khẩu?</h1>
            <p>Nhập email để nhận link đặt lại mật khẩu</p>
        </div>
        <div class="form">
            <!-- Success Message -->
            <div id="successMessage" class="success-message">
                <i class="fas fa-envelope-open-text"></i>
                <p>
                    <strong>Email đã được gửi!</strong><br>
                    Vui lòng kiểm tra hộp thư (và thư mục spam) để nhận link đặt lại mật khẩu.
                    Link sẽ hết hạn sau 1 giờ.
                </p>
            </div>
            
            <!-- Form -->
            <form id="forgotPasswordForm">
                <div id="errorMessage" class="error-message"></div>
                
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="Email đã đăng ký" required>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Gửi link đặt lại
                </button>
            </form>
            
            <div class="links">
                Nhớ mật khẩu rồi? <a href="dang-nhap.html">Đăng nhập</a>
            </div>
            <a href="../Background/background.html" class="back">
                <i class="fas fa-arrow-left"></i> Về trang chủ
            </a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';
        
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Reset messages
            errorDiv.style.display = 'none';
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang gửi...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Show success message, hide form
                    successDiv.style.display = 'block';
                    document.getElementById('forgotPasswordForm').style.display = 'none';
                } else {
                    // Show error
                    errorDiv.textContent = data.detail || 'Có lỗi xảy ra. Vui lòng thử lại.';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Gửi link đặt lại';
                }
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = 'Không thể kết nối đến server. Vui lòng thử lại sau.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Gửi link đặt lại';
            }
        });
    </script>
</body>

</html>
