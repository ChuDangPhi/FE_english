<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style3.css">
    <style>
        .success-message {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid #4ecdc4;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .success-message i {
            font-size: 3rem;
            color: #4ecdc4;
            margin-bottom: 15px;
        }
        .success-message p {
            color: #fff;
            line-height: 1.6;
        }
        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            color: #ff6b6b;
            display: none;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .password-strength {
            margin-top: 5px;
            font-size: 0.85rem;
        }
        .password-strength.weak { color: #ff6b6b; }
        .password-strength.medium { color: #ffd93d; }
        .password-strength.strong { color: #4ecdc4; }
        
        .invalid-token {
            text-align: center;
            padding: 20px;
        }
        .invalid-token i {
            font-size: 4rem;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .invalid-token h2 {
            color: #fff;
            margin-bottom: 10px;
        }
        .invalid-token p {
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Đặt lại mật khẩu</h1>
            <p>Tạo mật khẩu mới cho tài khoản của bạn</p>
        </div>
        <div class="form">
            <!-- Invalid Token Message -->
            <div id="invalidToken" class="invalid-token" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <h2>Link không hợp lệ</h2>
                <p>Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
                <a href="forgot-password.html" class="btn">
                    <i class="fas fa-redo"></i> Yêu cầu link mới
                </a>
            </div>
            
            <!-- Success Message -->
            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i>
                <p>
                    <strong>Đặt lại mật khẩu thành công!</strong><br>
                    Bạn có thể đăng nhập với mật khẩu mới.
                </p>
                <a href="dang-nhap.html" class="btn" style="margin-top: 15px;">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập ngay
                </a>
            </div>
            
            <!-- Form -->
            <form id="resetPasswordForm">
                <div id="errorMessage" class="error-message"></div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" placeholder="Mật khẩu mới" required minlength="6">
                    <i class="fas fa-eye-slash toggle-password" data-target="password"></i>
                </div>
                <div id="passwordStrength" class="password-strength"></div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Xác nhận mật khẩu mới" required minlength="6">
                    <i class="fas fa-eye-slash toggle-password" data-target="confirmPassword"></i>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    <i class="fas fa-key"></i> Đặt lại mật khẩu
                </button>
            </form>
            
            <a href="dang-nhap.html" class="back">
                <i class="fas fa-arrow-left"></i> Quay lại đăng nhập
            </a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';
        
        // Lấy token từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // Check token on load
        if (!token) {
            document.getElementById('resetPasswordForm').style.display = 'none';
            document.getElementById('invalidToken').style.display = 'block';
        }
        
        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                } else {
                    input.type = 'password';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                }
            });
        });
        
        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                return;
            }
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            if (strength <= 2) {
                strengthDiv.textContent = '⚠️ Mật khẩu yếu';
                strengthDiv.className = 'password-strength weak';
            } else if (strength <= 3) {
                strengthDiv.textContent = '⚡ Mật khẩu trung bình';
                strengthDiv.className = 'password-strength medium';
            } else {
                strengthDiv.textContent = '✅ Mật khẩu mạnh';
                strengthDiv.className = 'password-strength strong';
            }
        });
        
        // Form submit
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Reset messages
            errorDiv.style.display = 'none';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Mật khẩu xác nhận không khớp!';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Validate password strength
            if (password.length < 6) {
                errorDiv.textContent = 'Mật khẩu phải có ít nhất 6 ký tự!';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (!/[0-9]/.test(password) || !/[a-zA-Z]/.test(password)) {
                errorDiv.textContent = 'Mật khẩu phải chứa cả chữ và số!';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Show success message, hide form
                    successDiv.style.display = 'block';
                    document.getElementById('resetPasswordForm').style.display = 'none';
                } else {
                    // Show error
                    if (data.detail === 'Token không hợp lệ hoặc đã hết hạn') {
                        document.getElementById('resetPasswordForm').style.display = 'none';
                        document.getElementById('invalidToken').style.display = 'block';
                    } else {
                        errorDiv.textContent = data.detail || 'Có lỗi xảy ra. Vui lòng thử lại.';
                        errorDiv.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-key"></i> Đặt lại mật khẩu';
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = 'Không thể kết nối đến server. Vui lòng thử lại sau.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-key"></i> Đặt lại mật khẩu';
            }
        });
    </script>
</body>

</html>
